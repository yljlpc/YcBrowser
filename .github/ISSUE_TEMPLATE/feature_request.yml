name: Feature request
description: 提出一个新功能或改进建议
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 你遇到了什么不便？描述使用场景比描述方案更有帮助。
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 期望的方案
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的其他方案
    validations:
      required: false

  - type: textarea
    id: scope
    attributes:
      label: 影响范围
      description: |
        该功能是否会影响隐私、签名覆盖范围或打包体积？
        提示：本项目通过 SignPath Foundation 免费签名，分发物必须保持
        「全部组件开源」。若某项改动会引入闭源组件或无法再分发的资源，
        请在此说明。
    validations:
      required: false
