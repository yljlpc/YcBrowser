name: Bug report
description: 报告一个可复现的缺陷
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈！请先确认该问题在**最新版本**上仍存在。

        > 安全漏洞请勿在此提交 —— 请使用
        > **Security → Report a vulnerability** 私密上报。

  - type: textarea
    id: version
    attributes:
      label: 版本与来源
      description: 使用的版本号，以及下载来源（Releases / winget / 源码构建）
      placeholder: "1.1.13（从 GitHub Releases 下载）"
    validations:
      required: true

  - type: textarea
    id: os
    attributes:
      label: 系统环境
      description: 操作系统、版本、架构（x64 / ARM64）
      placeholder: "Windows 11 23H2 x64"
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: 复现步骤
      description: 最小可复现步骤，一步一行
      placeholder: |
        1. 打开设置
        2. 切换到「极速下载」
        3. 断网后重新联网
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 预期结果
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: 实际结果
      description: 附上错误信息或截图（如有）
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: 日志或其他信息
      description: 复现过程中的日志、崩溃信息或截图链接
    validations:
      required: false
