[package]
name = "omnibrowser-core"
version = "0.1.1"
edition = "2021"
description = "OmniBrowser native core: engine dispatch, Trident compat layer, navigation, tab runtime, IPC server"
license = "MIT"
publish = false

[lib]
name = "omnibrowser_core"
path = "src/lib.rs"

[[bin]]
name = "omnibrowser-core"
path = "src/main.rs"

[profile.release]
opt-level = 1
lto = false
codegen-units = 16
strip = true
panic = "abort"
incremental = true

[profile.dev]
opt-level = 0
incremental = true
